<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Body edge tracking test</title>
<style>body{margin:20px;background:#172633;color:#eef3f7;font:15px system-ui}canvas{width:min(420px,100%);background:#050a0e}table{border-collapse:collapse;margin-top:14px}td,th{border:1px solid #536d7d;padding:7px;text-align:left}.pass{color:#76e39d}.fail{color:#ff9c9c}</style>
<h1>Progressive body edge tracking</h1><p>This moves a real person and outstretched arms across a camera edge. It runs the same live Pose Landmarker worker, padded retry and motion bridge as the mirror.</p>
<canvas></canvas><table><thead><tr><th>Frame</th><th>Shift</th><th>Result</th><th>Visible joints</th><th>Recovery</th></tr></thead><tbody></tbody></table><p id="summary" role="status">Loading body model…</p>
<script type="module">
const query=new URLSearchParams(location.search),axis=query.get('axis')==='y'?'y':'x',image=new Image();image.src='./pose-example.jpg';await image.decode();
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),tbody=document.querySelector('tbody'),summary=document.querySelector('#summary');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
const exiting=query.has('exit'),shifts=exiting?[0,.08,.16,.24,.32,.40,.48,.56,.64,.72,.80,.90,1,1.10]:axis==='x'?[0,-.08,-.16,-.24,-.30,-.36,-.42,-.36,-.24,0,.08,.16,.24,.30,.36,.42,.36,.24,0]:[0,-.05,-.10,-.15,-.20,-.25,-.30,-.25,-.15,0,.05,.10,.15,.20,.25,.30,.25,.15,0];
let index=0,passes=0,edgePasses=0;const edgeLimit=axis==='x'?.30:.20;
const worker=new Worker('./worker.mjs?v=edge8',{type:'module'}),timeout=setTimeout(()=>{summary.textContent='FAIL: timeout';worker.terminate();},90000);
function draw(shift){ctx.fillStyle='#050a0e';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,axis==='x'?shift*canvas.width:0,axis==='y'?shift*canvas.height:0,canvas.width,canvas.height);}
async function send(){draw(shifts[index]);const frame=await createImageBitmap(canvas);worker.postMessage({frame,ts:1000+index*80},[frame]);}
worker.onerror=e=>{summary.textContent='FAIL: '+e.message;clearTimeout(timeout);};
worker.onmessage=async({data})=>{
 if(data.type==='ready'){await send();return;}if(data.type==='error'){summary.textContent='FAIL: '+data.message;return;}
 const shift=shifts[index],ok=!!data.pose,edge=Math.abs(shift)>=edgeLimit;if(ok)passes++;if(ok&&edge)edgePasses++;
 const recovery=data.recoveredByPadding?'padding':data.recoveredByMotion?'motion':'model';
 const row=tbody.insertRow();row.className=ok?'pass':'fail';for(const value of [index,shift.toFixed(2),ok?(data.pose.partial?'PARTIAL':'TRACKING'):data.landmarksDetected?'REJECTED':'LOST',data.pose?.evidence?.join(', ')||'—',recovery])row.insertCell().textContent=value;
 index++;if(index<shifts.length){await send();return;}clearTimeout(timeout);worker.terminate();const edgeTotal=shifts.filter(x=>Math.abs(x)>=edgeLimit).length;
 const finalLost=!tbody.rows[tbody.rows.length-1].classList.contains('pass');summary.className=exiting?(passes>=4&&finalLost?'pass':'fail'):(edgePasses>=Math.ceil(edgeTotal*.7)?'pass':'fail');
 summary.textContent=exiting?`${summary.className==='pass'?'PASS':'FAIL'} (full exit): followed ${passes} frames while body pixels crossed the edge; cleared after the person fully left.`:`${summary.className==='pass'?'PASS':'FAIL'} (${axis==='x'?'left/right':'top/bottom'}): ${passes}/${shifts.length} frames tracked; ${edgePasses}/${edgeTotal} boundary frames followed.`;
};
</script></html>
