<!doctype html><meta charset="utf-8"><title>Hand rig checks</title><style>body{background:#18212c;color:white;font:16px sans-serif}canvas{width:700px;height:700px}button{padding:12px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script><button id="rest">Rest</button><button id="victory">Scissors</button><button id="thumbs_up">Thumb up</button><button id="pointing_up">Left point</button><pre id="report">Loading</pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {TrackedHand} from './TrackedHand.js';
const report=document.querySelector('#report');try{
const asset=await new GLTFLoader().loadAsync('./tracked-hand.glb');const m=await (await fetch('./rig.json')).json();asset.scene.updateMatrixWorld(true);
const originalHeads=m.jointNames.map(n=>asset.scene.getObjectByName(n).getWorldPosition(new T.Vector3()));
const rest=m.restLandmarks.map(p=>new T.Vector3(...p));
const sourceError=Math.max(...originalHeads.map((p,i)=>p.distanceTo(rest[i])));
const hand=new TrackedHand(asset,m),fixtures=await(await fetch('./fixtures.json')).json();
const scene=new T.Scene();scene.add(hand.object);scene.add(new T.HemisphereLight(0xffffff,0x888888,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(.2,.4,.4);scene.add(light);
const camera=new T.PerspectiveCamera(35,1,.001,10);camera.up.set(0,0,-1);camera.position.set(0,.5,-.08);camera.lookAt(0,0,-.08);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(700,700);document.body.append(renderer.domElement);
function show(name){let pts,side;if(name==='rest'){pts=rest.map(p=>p.clone());side='Right';}else{const f=fixtures[name];pts=f.world.map(p=>new T.Vector3(p.x,-p.y,-p.z));side=f.handedness;const root=pts[0].clone();pts.forEach(p=>p.sub(root));camera.up.set(0,1,0);camera.position.set(0,0,.45);camera.lookAt(0,.05,0);}
const accepted=hand.update(pts,side);scene.updateMatrixWorld(true);renderer.render(scene,camera);
const bindingErrors=hand.bones.map((b,i)=>b.getWorldPosition(new T.Vector3()).distanceTo(pts[i]));
let maxWeight=0,unweighted=0;hand.meshes.forEach(mesh=>{const w=mesh.geometry.attributes.skinWeight;for(let i=0;i<w.count;i++){const sum=w.getX(i)+w.getY(i)+w.getZ(i)+w.getW(i);maxWeight=Math.max(maxWeight,Math.abs(1-sum));if(!sum)unweighted++;}});
const shaderFailures=renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length;
const saved=hand.bones.map(b=>b.matrix.clone());const bad=pts.map(p=>p.clone());bad[8].x=NaN;
const rejectsInvalid=!hand.update(bad,side) && hand.bones.every((b,i)=>b.matrix.equals(saved[i]));
const maxJointError=Math.max(...bindingErrors);
const parent=new T.Group();scene.add(parent);parent.add(hand.object);parent.scale.x=-1;parent.position.set(.12,.03,-.2);hand.update(pts,side);
const parentFrameError=hand.lastError;scene.add(hand.object);scene.remove(parent);hand.update(pts,side);
report.textContent=JSON.stringify({result:accepted&&sourceError<1e-6&&maxJointError<1e-8&&parentFrameError<1e-8&&maxWeight<1e-6&&!unweighted&&!shaderFailures&&rejectsInvalid?'PASS':'FAIL',pose:name,accepted,sourceHeadError:sourceError,jointError:maxJointError,parentFrameError,weightError:maxWeight,unweighted,shaderFailures,rejectsInvalid},null,2);
}
for(const name of ['rest','victory','thumbs_up','pointing_up'])document.getElementById(name).onclick=()=>show(name);show('rest');
}catch(e){report.textContent=e.stack;console.error(e);}
</script>
