<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPS Hand</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f1116; color: #fff; font: 16px/1.3 system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-rows: 1fr 1fr; height: 100%; }
  @media (orientation: landscape) { #app { grid-template-rows: 1fr; grid-template-columns: 1fr 1fr; } }
  .pane { position: relative; overflow: hidden; }
  video, #ov, #still { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #000; }
  #ov { position: absolute; inset: 0; background: none; pointer-events: none; }
  #gl { width: 100%; height: 100%; display: block; background: #1a1f2b; }
  .hud { position: absolute; left: 12px; right: 12px; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000; font-weight: 700; }
  #top { top: 10px; } #bottom { bottom: 12px; }
  #hand { color: #c8dcff; font-size: 14px; } #move { color: #78ff78; font-size: 26px; }
  #stats { font-size: 13px; color: #9aa4b8; white-space: pre-line; }
  #game { color: #ffe678; font-size: 22px; } #score { font-size: 15px; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: #0f1116; font-size: 18px; white-space: pre-line; }
  button { position: absolute; padding: 12px 22px; font: inherit; font-weight: 700; border: 0; border-radius: 999px; }
  #play { right: 12px; bottom: 12px; background: #78ff78; color: #000; }
  #play:disabled { opacity: .4; }
  #mode, #reset, #view { background: #2a3145; color: #fff; padding: 10px 16px; font-size: 14px; }
  #mode { left: 12px; bottom: 12px; } #reset { right: 12px; top: 12px; } #view { left: 12px; top: 12px; }
  #rig-status { position:absolute;bottom:64px;left:12px;right:12px;font-size:13px;color:#d3e4dd;text-shadow:0 1px 3px #000;pointer-events:none; }
  #joints { right:12px;top:58px;padding:9px 12px;font-size:13px;background:#273449;color:#d3e4dd; }
  #sample { position:absolute;left:12px;top:105px;max-width:calc(100% - 24px);font-size:14px;padding:7px;background:#172131;color:#fff;border:1px solid #526070;border-radius:6px;z-index:3; }
</style>
</head>
<body>
<div id="app">
  <div class="pane">
    <video id="cam" autoplay muted playsinline></video>
    <select id="sample" aria-label="Camera or sample pose"><option value="">Live camera</option><option value="open-hand.jpg">Open hand reference</option><option value="victory.jpg">Scissors photo</option><option value="thumbs_up.jpg">Thumbs-up photo</option><option value="pointing_up.jpg">Pointing photo (left hand)</option><option value="thumbs_down.jpg">Thumbs-down photo</option><option value="woman_hands.jpg">Two hands photo</option></select>
    <canvas id="ov"></canvas>
    <div class="hud" id="top"><div id="hand">HANDS: -</div><div id="move">MOVE: ?</div><div id="stats">tracker: loading (build 7)</div></div>
    <div class="hud" id="bottom"><div id="score">SCORE you 0 : 0 cpu</div><div id="game">Tap PLAY for a round</div></div>
    <div id="status">Loading hand tracker…</div>
  </div>
  <div class="pane">
    <canvas id="gl"></canvas>
    <div id="rig-status">Loading hand models...</div>
    <button id="joints">JOINTS: ON</button>
    <button id="view">VIEW: first person</button>
    <button id="reset">RESET OBJECTS</button>
    <button id="mode">MODE: predict</button>
    <button id="play">PLAY</button>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { TrackedHand } from "./hand/TrackedHand.js";
import RAPIER from "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/dist/rapier.mjs";

const BUILD = 7;   // shown in the HUD so a cached page is obvious (GitHub Pages caches for 10 min)
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
$("sample").value = Q.get("img") || "";
$("sample").onchange = () => { const q = new URLSearchParams(location.search); if ($("sample").value) q.set("img", $("sample").value); else q.delete("img"); location.search = q.toString(); };
// Assumed horizontal field of view of the phone camera (?fov=70 to override). Lateral motion does not depend on
// it; only the absolute depth scale does, so a wrong guess still gives one-for-one relative motion.
const HFOV = (+Q.get("fov") || 60) * Math.PI / 180;
const FLOOR_Y = +Q.get("floor") || -0.28;   // metres below the camera; the table the objects rest on (?floor=-0.2 to raise it)
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task";
// Lower presence/tracking thresholds = the tracker holds on longer through motion blur before giving up.
const TRACKER_OPTS = { runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.4 };

// --- skeleton + canonical bone lengths (same as rps_hand.py) ------------------------------------
const PARENT = {1:0,2:1,3:2,4:3, 5:0,6:5,7:6,8:7, 9:0,10:9,11:10,12:11, 13:0,14:13,15:14,16:15, 17:0,18:17,19:18,20:19};
const LENGTH = {1:.040,2:.035,3:.030,4:.025, 5:.092,6:.040,7:.025,8:.022, 9:.088,10:.045,11:.028,12:.022,
                13:.082,14:.040,15:.026,16:.022, 17:.076,18:.032,19:.020,20:.020};
const PALM = [0, 5, 9, 13, 17];
const PALM_EDGES = [[5, 9], [9, 13], [13, 17]];
const CONNECTIONS = Object.entries(PARENT).map(([j, p]) => [+p, +j]).concat(PALM_EDGES);
const BONES = Object.entries(PARENT).map(([j, p]) => ({ a: +p, b: +j, r: +j <= 4 ? 0.011 : +p === 0 ? 0.014 : 0.009 })).concat(PALM_EDGES.map(([a, b]) => ({ a, b, r: 0.014 })));
const JOINT_R = Array.from({ length: 21 }, (_, i) => BONES.find(b => b.b === i)?.r ?? 0.02);
const BEATS = { ROCK: "SCISSORS", PAPER: "ROCK", SCISSORS: "PAPER" };
const V = () => new THREE.Vector3();

// Where is the hand in 3D? World landmarks give the hand's metric shape already oriented to the camera but
// centred on the hand; image landmarks say where each joint appears on screen. With a pinhole camera of the
// assumed FOV, the unknown translation T solves a linear least squares (exact for the pinhole model):
//   for each joint  -Tx + xu*Tz = X - xu*Z   and   -Ty + yv*Tz = Y - yv*Z     (xu, yv = normalised image coords)
// Returns [Tx, Ty, Tz] in metres (camera frame: x right, y down, z away) and the reprojection error as a
// fraction of the frame width (a large value means the pose and the picture disagree).
function locate(world, image, W, H) {
  const k = 2 * Math.tan(HFOV / 2), n = 21;
  const xu = new Float32Array(n), yv = new Float32Array(n);
  let Sx = 0, Sy = 0, Sxx = 0, Sbu = 0, Sbv = 0, Sxb = 0;
  for (let i = 0; i < n; i++) {
    xu[i] = (image[i].x - 0.5) * k; yv[i] = (image[i].y - 0.5) * k * H / W;
    const bu = world[i].x - xu[i] * world[i].z, bv = world[i].y - yv[i] * world[i].z;
    Sx += xu[i]; Sy += yv[i]; Sxx += xu[i] * xu[i] + yv[i] * yv[i]; Sbu += bu; Sbv += bv; Sxb += xu[i] * bu + yv[i] * bv;
  }
  const Tz = (Sxb - (Sx * Sbu + Sy * Sbv) / n) / (Sxx - (Sx * Sx + Sy * Sy) / n);
  const Tx = (Sx * Tz - Sbu) / n, Ty = (Sy * Tz - Sbv) / n;
  let err = 0;
  for (let i = 0; i < n; i++) { const z = world[i].z + Tz; err += Math.hypot((world[i].x + Tx) / z - xu[i], (world[i].y + Ty) / z - yv[i]); }
  return [[Tx, Ty, Tz], err / n / k, xu, yv];
}

// Each joint's 3D position: where the camera SEES it (image landmark, back-projected) at the depth the world
// model gives it (world z + Tz). Lateral positions therefore match the video exactly; only depth is modelled.
// -> flat GL array (y up, z toward the phone camera), TRUE positions: your right hand has x < 0 (the camera's
// left); the selfie view mirrors the render instead.
function toGL(world, T, xu, yv) {
  const a = new Float32Array(63);
  for (let i = 0; i < 21; i++) { const z = world[i].z + T[2]; a[3*i] = xu[i] * z; a[3*i+1] = -yv[i] * z; a[3*i+2] = -z; }
  return a;
}
const vec = (a, i) => new THREE.Vector3(a[3*i], a[3*i+1], a[3*i+2]);
const toVecs = a => Array.from({ length: 21 }, (_, i) => vec(a, i));
const palmCentre = pts => { const c = V(); for (const i of PALM) c.add(pts[i]); return c.multiplyScalar(1 / PALM.length); };

// Canonical bone lengths, tracked bone directions, placed so the palm centre sits where the tracked palm is.
function retarget(a) {
  const pts = toVecs(a);
  const out = pts.map(() => V());
  for (let j = 1; j < 21; j++) {
    const p = PARENT[j], d = pts[j].clone().sub(pts[p]), n = d.length() || 1e-9;
    out[j].copy(out[p]).addScaledVector(d, LENGTH[j] / n);
  }
  const shift = palmCentre(pts).sub(palmCentre(out));
  return out.map(v => v.add(shift));
}

// Extended finger = tip further from the wrist than its middle joint. Thumb ignored (unreliable and irrelevant for RPS).
function fingersUp(pts) {
  const w = pts[0];
  return [[8, 6], [12, 10], [16, 14], [20, 18]].map(([tip, pip]) => pts[tip].distanceTo(w) > pts[pip].distanceTo(w));
}
function moveFromFingers(ext) {
  const n = ext.filter(Boolean).length;
  if (n === 0) return "ROCK";
  if (n >= 3) return "PAPER";
  if (ext[0] && ext[1] && !ext[2] && !ext[3]) return "SCISSORS";
  return null;
}

// --- One Euro filter over the 63 coordinates, with velocity prediction ---------------------------
// Casiez et al. 2012: low cutoff when still (no jitter), cutoff rises with speed (no lag). Units are metres,
// so beta is much larger than the pixel-space defaults: at 1 m/s the cutoff is minCutoff + beta.
class OneEuro {
  constructor(n, minCutoff = 1.0, beta = 20, dCutoff = 3) { this.x = null; this.dx = new Float32Array(n); this.t = 0; this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff; }
  alpha(cut, dt) { const tau = 1 / (2 * Math.PI * cut); return 1 / (1 + tau / dt); }
  push(x, t) {                     // t in seconds (capture time of the frame)
    if (!this.x) { this.x = Float32Array.from(x); this.t = t; return; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    const ad = this.alpha(this.dCutoff, dt);
    for (let i = 0; i < x.length; i++) {
      const dx = (x[i] - this.x[i]) / dt;
      this.dx[i] += ad * (dx - this.dx[i]);
      const a = this.alpha(this.minCutoff + this.beta * Math.abs(this.dx[i]), dt);
      this.x[i] += a * (x[i] - this.x[i]);
    }
  }
  predict(lead) {                  // extrapolate the hand as a rigid body: mean palm velocity applied to every joint (per-joint
    const v = [0, 0, 0];             // extrapolation amplifies fingertip noise into wobble); finger articulation stays smoothed
    for (const i of PALM) for (let k = 0; k < 3; k++) v[k] += this.dx[3 * i + k] / PALM.length;
    const out = new Float32Array(this.x.length);
    for (let i = 0; i < out.length; i++) out[i] = this.x[i] + v[i % 3] * lead;
    return out;
  }
}
const MAX_LEAD = 0.15;             // never extrapolate more than 150 ms ahead
const HOLD_MS = 250;               // keep a hand alive this long after tracking drops (dead reckoning), then remove it

// --- tracker: HandLandmarker in a Web Worker so rendering never waits on inference -----------------
const WORKER_SRC = `
import { FilesetResolver, HandLandmarker } from "${MP}/vision_bundle.mjs";
let lm, delegate;
const pack = r => r.landmarks.map((landmarks, i) => ({ landmarks, world: r.worldLandmarks[i], name: r.handedness[i]?.[0]?.categoryName ?? "?", score: r.handedness[i]?.[0]?.score ?? 0 }));
onmessage = async e => {
  if (e.data.init) {
    const vision = await FilesetResolver.forVisionTasks("${MP}/wasm", true);  // true = ES-module loader, required inside a module worker
    for (delegate of ["GPU", "CPU"]) {
      try { lm = await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: ${JSON.stringify(MODEL)}, delegate }, ...e.data.opts }); postMessage({ ready: true, delegate }); return; }
      catch (err) { console.warn(delegate + " failed in worker", err); }
    }
    postMessage({ ready: false }); return;
  }
  const t = performance.now();
  const r = lm.detectForVideo(e.data.frame, e.data.ts);
  e.data.frame.close();
  postMessage({ id: e.data.id, ms: performance.now() - t, hands: pack(r) });
};`;

async function makeTracker() {
  // 1) worker (preferred). 2) main-thread fallback if the worker cannot start (old Safari, no OffscreenCanvas).
  try {
    const w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" })), { type: "module" });
    const ready = await new Promise((res, rej) => {
      w.onmessage = e => res(e.data); w.onerror = e => rej(e.message || "worker error");
      w.postMessage({ init: true, opts: TRACKER_OPTS });
      setTimeout(() => rej("worker init timeout"), 60000);
    });
    if (!ready.ready) throw new Error("no delegate in worker");
    const waiting = new Map(); let id = 0;
    w.onmessage = e => { waiting.get(e.data.id)?.(e.data); waiting.delete(e.data.id); };
    return {
      where: "worker/" + ready.delegate,
      async detect(src, ts) {
        const frame = await createImageBitmap(src);
        return new Promise(res => { const my = ++id; waiting.set(my, res); w.postMessage({ id: my, frame, ts }, [frame]); });
      },
    };
  } catch (e) {
    console.warn("worker unavailable, tracking on main thread:", e);
    const { FilesetResolver, HandLandmarker } = await import(`${MP}/vision_bundle.mjs`);
    const vision = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
    const pack = r => r.landmarks.map((landmarks, i) => ({ landmarks, world: r.worldLandmarks[i], name: r.handedness[i]?.[0]?.categoryName ?? "?", score: r.handedness[i]?.[0]?.score ?? 0 }));
    for (const delegate of ["GPU", "CPU"]) {
      try {
        const lm = await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: MODEL, delegate }, ...TRACKER_OPTS });
        return { where: "main/" + delegate, async detect(src, ts) { const t = performance.now(); const r = lm.detectForVideo(src, ts); return { ms: performance.now() - t, hands: pack(r) }; } };
      } catch (err) { console.warn(delegate + " failed", err); }
    }
    throw new Error("Hand tracker failed to load. Check the connection and reload.");
  }
}

// --- scene: a room seen from where the phone camera is ------------------------------------------
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1f2b); scene.fog = new THREE.Fog(0x1a1f2b, 1.2, 3.5);
// Two views of the same room. "first person": the camera is at YOUR eyes, behind and above your hand, looking
// across the table at the opponent (phone plane = middle of the table, z = 0; you are at z < 0, they are at z > 0).
// "camera": the camera sits where the phone camera is, mirrored like the video pane (debug / comparison).
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 8);
const worldGroup = new THREE.Group(); scene.add(worldGroup);   // everything that must mirror in the selfie view
let frameW = 640, frameH = 480;   // camera frame size, set once the video is known
const VIEWS = ["first person", "camera"]; let view = 0;
$("view").onclick = () => { view = (view + 1) % VIEWS.length; $("view").textContent = "VIEW: " + VIEWS[view]; applyView(true); };
function applyView(force) {
  const w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio();
  if (!force && canvas.width === (w * pr | 0) && canvas.height === (h * pr | 0)) return;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  if (VIEWS[view] === "first person") {
    camera.position.set(0, 0.12, -0.85); camera.lookAt(0, -0.12, 0.5); camera.fov = 62; worldGroup.scale.x = 1;
  } else {
    // match the video pane's object-fit:cover crop: a pane taller than the frame shows the full frame height, a wider pane the full width
    const t = Math.tan(HFOV / 2);
    camera.position.set(0, 0, 0); camera.lookAt(0, 0, -1); worldGroup.scale.x = -1;
    camera.fov = 2 * Math.atan(w / h < frameW / frameH ? t * frameH / frameW : t / (w / h)) * 180 / Math.PI;
  }
  camera.updateProjectionMatrix();
}
scene.add(new THREE.HemisphereLight(0xfff8ee, 0x3a4560, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(0.5, 1.8, -0.3); key.target.position.set(0, FLOOR_Y, 0); scene.add(key, key.target);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -1.2, right: 1.2, top: 1.2, bottom: -1.2, near: 0.1, far: 5 });
const checker = (() => {   // procedural floor texture, no external file needed
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g.fillStyle = (x + y) & 1 ? "#303a4e" : "#262e3f"; g.fillRect(x * 32, y * 32, 32, 32); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12, 12); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshStandardMaterial({ map: checker, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, FLOOR_Y, 0); floor.receiveShadow = true; scene.add(floor);
for (const z of [-3.2, 3.2]) {   // a wall behind each player
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), new THREE.MeshStandardMaterial({ color: 0x252c3c, roughness: 1, side: THREE.DoubleSide }));
  wall.position.set(0, FLOOR_Y + 2.5, z); wall.receiveShadow = true; scene.add(wall);
}

// --- physics (Rapier): hands are kinematic colliders that push dynamic props around ----------------
await RAPIER.init();
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
world.createCollider(RAPIER.ColliderDesc.cuboid(3, 0.05, 3).setTranslation(0, FLOOR_Y - 0.05, 0).setFriction(0.8));
const PROPS = [
  { ball: 0.045, color: 0xff6b6b, x: -0.20, z: -0.30 }, { ball: 0.040, color: 0xffd166, x: 0.06, z: -0.18 }, { ball: 0.050, color: 0x4dabf7, x: 0.26, z: -0.34 },
  { box: 0.070, color: 0x69db7c, x: -0.05, z: -0.40 }, { box: 0.060, color: 0xb197fc, x: 0.18, z: -0.12 }, { box: 0.090, color: 0xffa94d, x: -0.30, z: -0.10 },
];
const props = PROPS.map(p => {
  const half = (p.ball ?? p.box) / (p.ball ? 1 : 2);
  const mesh = new THREE.Mesh(p.ball ? new THREE.SphereGeometry(p.ball, 24, 16) : new THREE.BoxGeometry(p.box, p.box, p.box), new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.5 }));
  mesh.castShadow = mesh.receiveShadow = true; worldGroup.add(mesh);
  const home = { x: p.x, y: FLOOR_Y + half + 0.02, z: p.z };
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(home.x, home.y, home.z).setAngularDamping(0.5));
  world.createCollider((p.ball ? RAPIER.ColliderDesc.ball(p.ball) : RAPIER.ColliderDesc.cuboid(half, half, half)).setRestitution(0.4).setFriction(0.7), body);
  return { mesh, body, home };
});
function resetProps() { for (const p of props) { p.body.setTranslation(p.home, true); p.body.setRotation({ x: 0, y: 0, z: 0, w: 1 }, true); p.body.setLinvel({ x: 0, y: 0, z: 0 }, true); p.body.setAngvel({ x: 0, y: 0, z: 0 }, true); } }
$("reset").onclick = resetProps;
const FAR = { x: 0, y: 10, z: 0 };   // parking spot for the colliders of a hand that is not in view

// --- 3D replica of one hand + its physics colliders ------------------------------------------------
let jointOverlay = true;
const replicas = [];
$("joints").onclick = () => { jointOverlay = !jointOverlay; replicas.forEach(r => r.showJoints(jointOverlay)); $("joints").textContent = "JOINTS: " + (jointOverlay ? "ON" : "OFF"); };
function makeHand(handedness, replica) {
  const group = replica.object; group.visible = false; worldGroup.add(group); replicas.push(replica);
  replica.showJoints(jointOverlay);
  const bodies = Array.from({ length: 22 }, (_, i) => {
    const b = world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(FAR.x, FAR.y, FAR.z));
    world.createCollider(RAPIER.ColliderDesc.ball(i < 21 ? Math.max(JOINT_R[i], 0.01) : 0.035), b); return b;
  });
  return {
    group,
    draw(pts, visible = true, side = handedness) {
      if (visible && replica.update(pts, side)) group.visible = true;
      pts.forEach((p, i) => bodies[i].setNextKinematicTranslation(visible ? p : FAR));
      bodies[21].setNextKinematicTranslation(visible ? palmCentre(pts) : FAR);
    },
    hide() { group.visible = false; for (const b of bodies) b.setNextKinematicTranslation(FAR); },
  };
}
// --- the opponent's hand: a posed hand across the table until a real opponent is networked in ---------
// Built on the same skeleton: wrist at the origin of a frame (U = finger direction, N = palm normal pointing
// at you, S = thumb side); each finger is bent by cumulative angles at its three joints.
const OPP = { at: new THREE.Vector3(0.08, -0.04, 0.30), U: new THREE.Vector3(0, 0.85, -0.5).normalize(), N: new THREE.Vector3(0, -0.5, -0.85).normalize(), S: new THREE.Vector3(-1, 0, 0) };
const CURL = { open: [0, 0, 0], idle: [25, 30, 15], fist: [85, 100, 60] };
const MCP = { 5: [0.032, 0.092], 9: [0.011, 0.088], 13: [-0.010, 0.082], 17: [-0.030, 0.076] };   // [thumb-side offset, forward] from the wrist
const POSE = { ROCK: ["fist", "fist", "fist", "fist", false], PAPER: ["open", "open", "open", "open", true], SCISSORS: ["open", "open", "fist", "fist", false], IDLE: ["idle", "idle", "idle", "idle", true] };
function synthHand(name, origin) {
  const { U, N, S } = OPP, pts = Array.from({ length: 21 }, () => origin.clone()), [ci, cm, cr, cp, thumbOut] = POSE[name];
  const dir = (a, b, c) => V().addScaledVector(S, a).addScaledVector(U, b).addScaledVector(N, c).normalize();
  [[5, ci], [9, cm], [13, cr], [17, cp]].forEach(([mcp, curl]) => {
    pts[mcp].addScaledVector(S, MCP[mcp][0]).addScaledVector(U, MCP[mcp][1]);
    let theta = 0;
    for (let k = 1; k <= 3; k++) {
      theta += CURL[curl][k - 1] * Math.PI / 180;
      pts[mcp + k].copy(pts[mcp + k - 1]).addScaledVector(dir(0, Math.cos(theta), -Math.sin(theta)), LENGTH[mcp + k]);
    }
  });
  pts[1].addScaledVector(S, 0.030).addScaledVector(U, 0.025).addScaledVector(N, -0.01);
  const thumb = thumbOut ? [dir(0.75, 0.55, 0), dir(0.6, 0.7, 0), dir(0.5, 0.8, 0)] : [dir(0.4, 0.6, -0.4), dir(-0.6, 0.3, -0.5), dir(-0.9, 0.1, -0.3)];
  for (let k = 2; k <= 4; k++) pts[k].copy(pts[k - 1]).addScaledVector(thumb[k - 2], LENGTH[k]);
  return pts;
}

// --- 2D overlay on the camera (raw landmarks, unfiltered, so you can compare against the 3D hands) ------
const ov = $("ov"), octx = ov.getContext("2d");
function drawOverlay(hands, src) {
  const w = src.videoWidth || src.naturalWidth || 0, h = src.videoHeight || src.naturalHeight || 0;
  if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
  octx.clearRect(0, 0, w, h);
  const tips = [4, 8, 12, 16, 20];
  for (const lm of hands) {
    octx.lineWidth = Math.max(2, w / 240); octx.strokeStyle = "#78ff78"; octx.lineCap = "round";
    octx.beginPath();
    for (const [a, b] of CONNECTIONS) { octx.moveTo(lm[a].x * w, lm[a].y * h); octx.lineTo(lm[b].x * w, lm[b].y * h); }
    octx.stroke();
    lm.forEach((p, i) => {
      octx.beginPath(); octx.arc(p.x * w, p.y * h, tips.includes(i) ? w / 90 : w / 140, 0, Math.PI * 2);
      octx.fillStyle = i === 0 ? "#ff7878" : tips.includes(i) ? "#ffe678" : "#fff"; octx.fill();
    });
  }
}

// --- game ---------------------------------------------------------------------------------------
const game = { phase: "idle", t0: 0, you: null, cpu: null, score: [0, 0] };
$("play").onclick = () => { if (game.phase === "idle") { game.phase = "count"; game.t0 = performance.now(); } };
function updateGame(now, move) {
  if (game.phase === "count" && now - game.t0 >= 3000) {
    game.you = move; game.cpu = Q.get("cpu") in BEATS ? Q.get("cpu") : Object.keys(BEATS)[Math.floor(Math.random() * 3)]; game.phase = "result"; game.t0 = now;   // ?cpu=ROCK forces the computer move (tests)
    if (game.you && BEATS[game.you] === game.cpu) game.score[0]++;
    else if (game.you && BEATS[game.cpu] === game.you) game.score[1]++;
  } else if (game.phase === "result" && now - game.t0 >= 3000) game.phase = "idle";
  $("play").disabled = game.phase !== "idle";
  $("score").textContent = `SCORE you ${game.score[0]} : ${game.score[1]} cpu`;
  if (game.phase === "count") $("game").textContent = `SHOOT IN ${3 - Math.floor((now - game.t0) / 1000)}`;
  else if (game.phase === "result") {
    const v = !game.you ? "NO MOVE SEEN" : game.you === game.cpu ? "DRAW" : BEATS[game.you] === game.cpu ? "YOU WIN" : "CPU WINS";
    $("game").textContent = `YOU ${game.you ?? "?"} vs CPU ${game.cpu} - ${v}`;
  } else $("game").textContent = "Tap PLAY for a round";
}

// --- main ---------------------------------------------------------------------------------------
const MODES = ["predict", "smooth", "raw"];   // predict = filter + velocity lead, smooth = filter only, raw = latest tracker result
let mode = 0;
$("mode").onclick = () => { mode = (mode + 1) % MODES.length; $("mode").textContent = "MODE: " + MODES[mode]; };

async function main() {
  let video = $("cam");
  const imgSrc = Q.get("img");  // ?img=victory.jpg = self-check without a camera
  if (imgSrc) {
    const img = new Image(); img.src = imgSrc; await img.decode();
    img.id = "still"; video.replaceWith(img); video = img;
  } else try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }, audio: false });
    await new Promise(r => video.onloadedmetadata = r);
  } catch (e) { $("status").textContent = "Camera blocked: " + e.message + "\nAllow the camera and reload."; return; }

  frameW = video.videoWidth || video.naturalWidth || frameW; frameH = video.videoHeight || video.naturalHeight || frameH;
  const [rightModel, leftModel, opponentModel] = await Promise.all([TrackedHand.load(), TrackedHand.load(), TrackedHand.load()]);
  const models = { Right: rightModel, Left: leftModel };
  const tracker = await makeTracker();
  $("status").remove();

  // one slot per hand, keyed by MediaPipe's handedness label
  const slots = { Right: null, Left: null };
  for (const k in slots) slots[k] = { key: k, name: "?", filt: new OneEuro(63), raw: null, lastSeen: -1e9, img: [0, 0], ext: [0, 0, 0, 0], fit: 0, depth: 0, hand: makeHand(k, models[k]) };
  const imgCentre = lm => PALM.reduce((c, i) => [c[0] + lm[i].x / PALM.length, c[1] + lm[i].y / PALM.length], [0, 0]);
  const dist2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  // Which slot does a detection belong to? MediaPipe's Left/Right label flickers, so match by position first:
  // nearest recently-seen slot (within a quarter of the frame), otherwise a free slot, label as tie-breaker.
  function assign(hands, now) {
    let dets = hands.map(h => ({ h, c: imgCentre(h.landmarks), span: Math.hypot(h.landmarks[0].x - h.landmarks[9].x, h.landmarks[0].y - h.landmarks[9].y) }));
    dets = dets.filter((d, i) => !dets.some((o, j) => j !== i && dist2(d.c, o.c) < 0.6 * Math.max(d.span, o.span) && (o.h.score > d.h.score || (o.h.score === d.h.score && j < i))));   // same hand twice
    const out = new Map(), free = Object.values(slots);
    const pairs = [];
    for (const d of dets) for (const s of free) if (now - s.lastSeen < hold) pairs.push([dist2(d.c, s.img), d, s]);
    pairs.sort((a, b) => a[0] - b[0]);
    for (const [dd, d, s] of pairs) if (dd < 0.25 && !out.has(d) && free.includes(s)) { out.set(d, s); free.splice(free.indexOf(s), 1); }
    for (const d of dets) if (!out.has(d) && free.length) { const s = free.find(x => x.key === d.h.name) ?? free[0]; out.set(d, s); free.splice(free.indexOf(s), 1); }
    return out;
  }
  const opp = makeHand("Right", opponentModel); const oppPts = synthHand("IDLE", OPP.at);   // the opponent's hand, a shade darker
  let lastT = -1, ts = 0, inflight = false, move = null, nHands = 0, lastRecv = 0, hold = HOLD_MS;
  let stat = { ms: 0, lat: 0, n: 0, t: performance.now() }, prev = performance.now();

  const pump = async () => {
    const fresh = imgSrc || (video.currentTime !== lastT && video.readyState >= 2);
    if (inflight || !fresh) return;
    inflight = true; lastT = video.currentTime;
    const cap = performance.now(); ts = Math.max(ts + 1, Math.floor(cap));
    const r = await tracker.detect(video, ts);
    inflight = false;
    const recv = performance.now();
    hold = Math.max(HOLD_MS, 2.5 * (recv - lastRecv)); lastRecv = recv;   // slow devices get a longer hold so hands don't flicker between results
    stat.ms += r.ms; stat.lat += recv - cap; stat.n++; nHands = r.hands.length;
    drawOverlay(r.hands.map(h => h.landmarks), video);
    for (const [d, s] of assign(r.hands, recv)) {
      const h = d.h; let T, xu, yv; [T, s.fit, xu, yv] = locate(h.world, h.landmarks, frameW, frameH);
      // Keep handedness stable through label flicker; reacquire it when a slot is reused.
      if (!s.rigSide || recv - s.lastSeen >= hold) s.rigSide = h.name in models ? h.name : s.key;
      s.raw = toGL(h.world, T, xu, yv); s.filt.push(s.raw, cap / 1000); s.lastSeen = recv; s.img = d.c; s.name = h.name;
      const pts = retarget(s.filt.x); s.ext = fingersUp(pts); s.depth = -palmCentre(pts).z;
    }
  };

  const loop = () => {
    const now = performance.now(), dt = Math.min((now - prev) / 1000, 1 / 30); prev = now;
    pump();
    const hud = [];
    move = null;
    for (const s of [slots.Right, slots.Left]) {
      const visible = now - s.lastSeen < hold;   // dead-reckon through short dropouts, then remove the hand from the scene
      if (visible) {
        const lead = Math.min(MAX_LEAD, Math.max(0, (now - s.lastSeen) / 1000 + 0.02));
        const pts = MODES[mode] === "predict" ? s.filt.predict(lead) : MODES[mode] === "smooth" ? s.filt.x : s.raw;
        s.hand.draw(toVecs(pts), true, s.rigSide);
      } else s.hand.hide();
      if (visible) { move ??= moveFromFingers(s.ext); hud.push(`${s.name[0]} ${s.depth.toFixed(2)}m ${s.ext.filter(Boolean).length}up fit ${(s.fit * 100).toFixed(1)}%`); }
    }
    // opponent: pumps a fist during the countdown, shows the computer's move in the result, relaxes otherwise
    const oppPose = game.phase === "count" ? "ROCK" : game.phase === "result" ? game.cpu : "IDLE";
    const bob = game.phase === "count" ? 0.07 * Math.abs(Math.sin(Math.PI * (now - game.t0) / 1000)) : 0;
    const target = synthHand(oppPose, OPP.at.clone().setY(OPP.at.y + bob));
    oppPts.forEach((p, i) => p.lerp(target[i], 0.25));
    opp.draw(oppPts);
    world.timestep = dt; world.step();
    for (const p of props) { p.mesh.position.copy(p.body.translation()); p.mesh.quaternion.copy(p.body.rotation()); }
    if (now - stat.t > 1000) {
      $("stats").textContent = `tracker: ${(stat.ms / (stat.n || 1)).toFixed(0)} ms | ${stat.n} fps | latency ${(stat.lat / (stat.n || 1)).toFixed(0)} ms | hands ${nHands}\n${tracker.where} | mode ${MODES[mode]} | build ${BUILD}`;
      stat = { ms: 0, lat: 0, n: 0, t: now };
    }
    $("rig-status").textContent = hud.length ? "21 rig joints per hand following tracking" : "Show a hand to begin";
    $("hand").textContent = "HANDS: " + (hud.join("  |  ") || "-");
    $("move").textContent = "MOVE: " + (move ?? "?"); $("move").style.color = move ? "#78ff78" : "#ffc850";
    updateGame(now, move);
    applyView(false); renderer.render(scene, camera);
    requestAnimationFrame(loop);
  };
  loop();
}
main().catch(e => { console.error(e); const s = $("status"); if (s) s.textContent = "Error: " + e.message; else $("game").textContent = "Error: " + e.message; });
</script>
</body>
</html>
