<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPS Hand</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f1116; color: #fff; font: 16px/1.3 system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-rows: 1fr 1fr; height: 100%; }

  .pane { position: relative; overflow: hidden; }
  video, #ov, #still { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #000; }
  body.mirror video, body.mirror #ov, body.mirror #still { object-fit: contain; }   /* mirror view = the whole camera frame, one to one */
  #ov { position: absolute; inset: 0; background: none; pointer-events: none; }
  #gl { width: 100%; height: 100%; display: block; background: #1a1f2b; }
  .hud { position: absolute; left: 12px; right: 12px; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000; font-weight: 700; }
  #top { top: 10px; } #bottom { bottom: 12px; }
  #hand { color: #c8dcff; font-size: 14px; } #move { color: #78ff78; font-size: 26px; }
  #stats { font-size: 13px; color: #9aa4b8; white-space: pre-line; }
  #game { color: #ffe678; font-size: 22px; } #score { font-size: 15px; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: #0f1116; font-size: 18px; white-space: pre-line; }
  button { position: absolute; padding: 12px 22px; font: inherit; font-weight: 700; border: 0; border-radius: 999px; }
  #play { right: 12px; bottom: 12px; background: #78ff78; color: #000; }
  #play:disabled { opacity: .4; }
  #mode, #reset, #view, #online, #link { background: #2a3145; color: #fff; padding: 10px 16px; font-size: 14px; }
  #mode { left: 12px; bottom: 12px; } #reset { right: 12px; top: 12px; } #view { left: 12px; top: 12px; }
  #online { right: 12px; top: 12px; } #link { right: 12px; top: 62px; } #camBtn { left: 12px; top: 62px; background: #2a3145; color: #fff; padding: 10px 16px; font-size: 14px; }
  #camp { position: absolute; left: 12px; top: 112px; width: min(92vw, 280px); background: rgba(20,24,36,.94); border-radius: 14px; padding: 10px 12px; z-index: 5; font-size: 13px; }

  #play { right: 12px; bottom: 12px; background: #78ff78; color: #000; display: none; }

<body>

  <div>
    <h1>RPS Hand</h1>

    <button class="big pc" id="pickScreen">🖥 SCREEN - show the 3D view (gives a code + QR)</button>

  </div>
</div>

    <video id="cam" autoplay muted playsinline></video>
    <canvas id="ov"></canvas>
    <div class="hud" id="top"><div id="hand">HANDS: -</div><div id="move">MOVE: ?</div><div id="stats">tracker: loading (build 44)</div></div>

  </div>

    <button id="camBtn">CAM</button>
    <div id="camp" hidden>

      <label>HEIGHT <input id="cHeight" type="range" min="0" max="0.7" step="0.01"><span id="vHeight"></span></label>

      <label>TILT <input id="cTilt" type="range" min="-0.8" max="0.5" step="0.01"><span id="vTilt"></span></label>
      <div style="color:#9aa4b8">first person only; saved on this device</div>
    </div>
    <button id="mode">MODE: predict</button>
    <button id="online">ONLINE</button>
    <button id="link">PC LINK</button>
    <button id="play">PLAY</button>
    <div id="lobby" hidden>

    </div>

  </div>
</div>
